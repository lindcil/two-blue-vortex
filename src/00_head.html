<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Two Blue Vortex — Tranche verticale</title>
<meta name="description" content="Boruto: Two Blue Vortex — jeu d'action RPG non officiel, fait par un fan.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;600;800&display=swap">
<style>
:root{--ink:#0b1020;--deep:#111a33;--vortex:#3aa0ff;--vortex2:#8fd3ff;--paper:#eef3ff;--dim:#93a3c6;--warn:#ff6b5e;--gold:#ffd166;--ts:1;
 --f-title:'Space Grotesk',ui-sans-serif,system-ui,'Segoe UI',Roboto,sans-serif;--f-body:'Inter',ui-sans-serif,system-ui,'Segoe UI',Roboto,sans-serif}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--ink);color:var(--paper);font-family:var(--f-body);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
#cv{position:fixed;inset:0;width:100vw;height:100vh;display:block}
.ui{position:fixed;font-size:calc(16px * var(--ts));text-shadow:0 1px 0 #000,0 0 6px rgba(0,0,0,.6)}
#obj{top:max(14px,env(safe-area-inset-top));left:18px;max-width:60vw;transition:opacity .8s;font-weight:600;letter-spacing:.01em}
#obj small{display:block;font:500 calc(12px * var(--ts)) var(--f-title);color:var(--vortex2);letter-spacing:.18em;text-transform:uppercase}
#prompt{left:50%;bottom:22%;transform:translateX(-50%);padding:6px 12px;border-radius:999px;background:rgba(11,16,32,.82);border:1px solid rgba(143,211,255,.45);opacity:0;transition:opacity .2s;white-space:nowrap}
#prompt.on{opacity:1}
kbd{font:700 calc(12px * var(--ts)) var(--f-title);padding:1px 7px;border-radius:6px;border:1px solid var(--vortex2);color:var(--vortex2);background:rgba(58,160,255,.12)}
body.talking #touch{opacity:0;pointer-events:none}
#talk{z-index:20;left:50%;bottom:max(24px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(680px,92vw);padding:14px 18px 12px;background:rgba(8,12,26,.94);border-left:4px solid var(--vortex);border-radius:4px 14px 14px 4px;display:none}
#talk b{font:700 calc(13px * var(--ts)) var(--f-title);letter-spacing:.14em;text-transform:uppercase;color:var(--vortex2)}
#talk p{margin:6px 0 4px;font-size:calc(19px * var(--ts));line-height:1.35}
#talk i{float:right;font-style:normal;color:var(--dim);font-size:calc(12px * var(--ts))}
#toast{right:18px;top:max(14px,env(safe-area-inset-top));text-align:right;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
#toast div{padding:6px 12px;border-radius:10px;background:rgba(11,16,32,.85);border:1px solid rgba(255,209,102,.5);animation:tin .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes tin{from{transform:translateX(40px);opacity:0}}
#title{position:fixed;inset:0;display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-end;padding:0 7vw 12vh;background:radial-gradient(ellipse at 70% 40%,rgba(58,160,255,.18),transparent 60%),linear-gradient(180deg,rgba(11,16,32,0),rgba(11,16,32,.85))}
#title h1{font:700 clamp(44px,9vw,120px)/.9 var(--f-title);margin:0;letter-spacing:-.03em}
#title h1 span{display:block;color:var(--vortex);-webkit-text-stroke:0}
#title p{color:var(--dim);margin:14px 0 26px;max-width:520px;font-size:calc(16px * var(--ts))}
.btns{display:flex;gap:12px;flex-wrap:wrap}
button.b{all:unset;cursor:pointer;font:700 calc(15px * var(--ts)) var(--f-title);letter-spacing:.08em;text-transform:uppercase;padding:14px 22px;border-radius:12px;border:1.5px solid rgba(143,211,255,.5);background:rgba(17,26,51,.7);transition:transform .12s,background .12s}
button.b:hover,button.b:focus-visible{background:rgba(58,160,255,.25);transform:translateY(-2px);outline:2px solid var(--vortex2)}
button.b.p{background:var(--vortex);color:#06101f;border-color:var(--vortex)}
#sheet{position:fixed;inset:0;background:rgba(6,10,22,.94);display:none;flex-direction:column;padding:max(18px,env(safe-area-inset-top)) 5vw 20px}
#sheet nav{display:flex;gap:4px;border-bottom:1px solid rgba(143,211,255,.2);overflow-x:auto}
#sheet nav button{all:unset;cursor:pointer;padding:12px 16px;font:700 calc(14px * var(--ts)) var(--f-title);letter-spacing:.12em;text-transform:uppercase;color:var(--dim);border-bottom:3px solid transparent}
#sheet nav button.on{color:var(--paper);border-color:var(--vortex)}
#sheet .body{flex:1;overflow:auto;padding:18px 0;font-size:calc(16px * var(--ts))}
#sheet .close{position:absolute;right:5vw;top:max(18px,env(safe-area-inset-top))}
.row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:10px 0;border-bottom:1px solid rgba(143,211,255,.08);max-width:720px}
.row label{flex:1}.row select,.row input[type=range]{min-width:180px;font:inherit;background:#0e1630;color:var(--paper);border:1px solid #2a3b66;border-radius:8px;padding:6px}
.keybtn{all:unset;cursor:pointer;min-width:90px;text-align:center;padding:6px 10px;border-radius:8px;border:1px solid #2a3b66;font:700 calc(13px * var(--ts)) var(--f-title)}
.keybtn.wait{border-color:var(--gold);color:var(--gold)}
.q{padding:12px 14px;border-left:3px solid var(--vortex);background:rgba(17,26,51,.6);margin:0 0 10px;max-width:720px;border-radius:0 10px 10px 0}.q.done{opacity:.5;border-color:#3a4a6a}
.q b{font-family:var(--f-title)}
.rx{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;max-width:980px}.rx div{padding:10px 12px;border-radius:10px;background:rgba(17,26,51,.7)}
#touch{position:fixed;inset:0;pointer-events:none;display:none}
#touch .stick{position:absolute;left:28px;bottom:28px;width:150px;height:150px;border-radius:50%;border:2px solid rgba(143,211,255,.35);pointer-events:auto}
#touch .knob{position:absolute;left:50%;top:50%;width:62px;height:62px;margin:-31px;border-radius:50%;background:rgba(58,160,255,.35)}
#touch .tb{position:absolute;width:64px;height:64px;border-radius:50%;border:2px solid rgba(143,211,255,.45);background:rgba(11,16,32,.55);pointer-events:auto;display:flex;align-items:center;justify-content:center;font:700 14px var(--f-title)}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .5s}
body.hc .ui{text-shadow:none}body.hc #talk,body.hc #prompt{background:#000;border-color:#fff}
</style></head><body>
<canvas id="cv"></canvas>
<div id="obj" class="ui"></div><div id="prompt" class="ui"></div><div id="toast" class="ui"></div>
<div id="talk" class="ui"><b></b><p></p><i></i></div>
<div id="touch"><div class="stick"><div class="knob"></div></div></div>
<div id="title"><h1>Two Blue<span>Vortex</span></h1><p>Trois ans après l'Omnipotence, Konoha croit que tu as tué ton père. Code frappe le village. Il est temps de rentrer.</p>
<div class="btns"><button class="b p" id="bPlay">Jouer</button><button class="b" id="bNew" hidden>Nouvelle partie</button><button class="b" id="bOpt">Réglages</button></div>
<p style="font-size:12px;margin:22px 0 0">Jeu de fan non officiel · Boruto © Ukyō Kodachi / Mikio Ikemoto / Shūeisha</p></div>
<div id="sheet"><nav></nav><div class="body"></div><button class="b close" id="bClose">Fermer</button></div>
<div id="fade"></div>
<script>
