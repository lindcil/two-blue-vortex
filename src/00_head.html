<style>

:root{--ink:#0b1020;--deep:#111a33;--vortex:#3aa0ff;--vortex2:#8fd3ff;--paper:#eef3ff;--dim:#93a3c6;--warn:#ff6b5e;--gold:#ffd166;--ts:1;
 --f-title:'TBV Ext','Lilita One',Impact,'Arial Black',system-ui,sans-serif;--f-pop:'TBV Ext','Luckiest Guy','Lilita One',Impact,'Arial Black',sans-serif;--f-body:'TBV Ext','Lilita One',ui-rounded,'Segoe UI',system-ui,sans-serif;--ok:#5ee08a}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--ink);color:var(--paper);font-family:var(--f-body);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}

kbd{font:700 calc(12px * var(--ts)) var(--f-title);padding:1px 7px;border-radius:6px;border:1px solid var(--vortex2);color:var(--vortex2);background:rgba(58,160,255,.12)}

#sheet{position:fixed;inset:0;background:rgba(6,10,22,.94);display:none;flex-direction:column;padding:max(18px,env(safe-area-inset-top)) 5vw 20px}

#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .5s}
body.hc .ui{text-shadow:none}body.hc #talk,body.hc #prompt{background:#000;border-color:#fff}

/* v0.2 : typographie lourde et compacte (façon Burbank), rebonds, récompenses qui « pop » */
#title h1{font:400 clamp(54px,11vw,150px)/.86 var(--f-pop);letter-spacing:.01em;text-transform:uppercase;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 6px 0 var(--ink)}
#title h1 span{color:var(--vortex);display:block;transform:rotate(-2deg);transform-origin:left}
button.b{font:400 calc(18px * var(--ts)) var(--f-title);letter-spacing:.04em;border-radius:14px;border-width:3px;border-color:var(--ink);box-shadow:0 5px 0 var(--ink);transition:transform .18s cubic-bezier(.3,1.8,.5,1),background .12s,box-shadow .12s}
button.b:hover,button.b:focus-visible{transform:translateY(-3px) scale(1.04);background:rgba(58,160,255,.3)}
button.b:active{transform:translateY(3px) scale(.97);box-shadow:0 1px 0 var(--ink)}

#talk{border:3px solid var(--ink);border-left:6px solid var(--vortex);box-shadow:0 6px 0 rgba(0,0,0,.45)}
#talk.pop{animation:tpop .28s cubic-bezier(.2,1.6,.4,1)}@keyframes tpop{from{transform:translateX(-50%) scale(.92);opacity:.4}}
#talk b{font:400 calc(16px * var(--ts)) var(--f-title);letter-spacing:.06em}
#talk p{font:400 calc(20px * var(--ts))/1.3 var(--f-body);letter-spacing:.01em}
#talk .opts{display:flex;flex-direction:column;gap:6px;margin-top:6px}#talk .opts:empty{display:none}
.opt{all:unset;cursor:pointer;padding:9px 12px;border-radius:10px;border:2px solid #2a3b66;font:400 calc(17px * var(--ts)) var(--f-title);transition:transform .15s cubic-bezier(.3,1.8,.5,1)}
.opt.on,.opt:hover{border-color:var(--gold);background:rgba(255,209,102,.12);transform:translateX(6px)}
#toast div{font:400 calc(16px * var(--ts)) var(--f-title);border:2px solid var(--ink);box-shadow:0 3px 0 rgba(0,0,0,.4);animation:tin .4s cubic-bezier(.2,1.6,.4,1)}
#obj{font:400 calc(18px * var(--ts)) var(--f-title)}#obj small{font:400 calc(13px * var(--ts)) var(--f-title);letter-spacing:.12em}
#rewards{position:fixed;left:50%;top:22%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;z-index:15}
.reward{font:400 calc(40px * var(--ts)) var(--f-pop);color:var(--rc);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--ink);animation:rpop 2.6s cubic-bezier(.2,1.6,.4,1) forwards;white-space:nowrap}
.reward.sm{font-size:calc(26px * var(--ts));animation-duration:1.8s}
@keyframes rpop{0%{transform:scale(.2) rotate(-6deg);opacity:0}12%{transform:scale(1.25) rotate(2deg);opacity:1}22%{transform:scale(1) rotate(0)}80%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-30px)}}
#sheet nav button{font:400 calc(16px * var(--ts)) var(--f-title);letter-spacing:.06em}
#sheet h3{font:400 calc(22px * var(--ts)) var(--f-title);margin:18px 0 8px}
.mates{display:flex;gap:10px;flex-wrap:wrap}.mate{padding:12px 14px;border-radius:12px;background:rgba(17,26,51,.75);border:3px solid;min-width:220px;display:flex;flex-direction:column;gap:4px;font-family:var(--f-title)}.mate small{color:var(--dim);font-size:13px}.mate.me{max-width:520px}
.pips i{display:inline-block;width:12px;height:12px;margin:0 2px;border-radius:50%;border:2px solid #ff9ad0;transform:rotate(45deg);border-radius:3px}.pips i.on{background:#ff9ad0}
#create{position:fixed;inset:0;display:none;background:radial-gradient(ellipse at 30% 40%,rgba(58,160,255,.2),transparent 60%),rgba(6,10,22,.96);padding:max(16px,env(safe-area-inset-top)) 5vw 16px;overflow:auto;z-index:12}
#create h2{font:400 clamp(30px,5vw,54px) var(--f-pop);margin:0 0 6px;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--ink)}
#create .grid{display:grid;grid-template-columns:minmax(220px,320px) 1fr;gap:20px;align-items:start}@media (max-width:720px){#create .grid{grid-template-columns:1fr}}

.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{all:unset;cursor:pointer;padding:8px 12px;border-radius:10px;border:2px solid #2a3b66;font:400 calc(16px * var(--ts)) var(--f-title);transition:transform .15s cubic-bezier(.3,1.8,.5,1)}
.chip.on{border-color:var(--gold);background:rgba(255,209,102,.15)}.chip:hover,.chip:focus-visible{transform:scale(1.06);outline:none;border-color:var(--vortex2)}

#create .el{font:400 calc(18px * var(--ts)) var(--f-title);color:var(--dim)}

<script>
